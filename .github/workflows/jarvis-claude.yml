name: Jarvis Claude Code

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      github.actor == 'fynnoman' &&
      (
        (github.event_name == 'issues' &&
         contains(github.event.issue.body, '@claude')) ||
        (github.event_name == 'issue_comment' &&
         contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          branch_prefix: claude/
          claude_args: |
            --max-turns 20

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge Claude branch into main
        if: ${{ success() && steps.claude.outputs.conclusion == 'success' && steps.claude.outputs.branch_name != '' }}
        env:
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CLAUDE_BRANCH" != claude/* ]] || ! git check-ref-format --branch "$CLAUDE_BRANCH"; then
            echo "Invalid Claude branch: $CLAUDE_BRANCH"
            exit 1
          fi
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/$CLAUDE_BRANCH:refs/remotes/origin/$CLAUDE_BRANCH"
          if git merge-base --is-ancestor "origin/$CLAUDE_BRANCH" origin/main; then
            echo "No new changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B jarvis-auto-merge origin/main
          git merge --no-edit "origin/$CLAUDE_BRANCH"
          # Run repository tests before publishing when Node project is present.
          if [[ -f package.json ]]; then
            npm ci
            export CI=true
            # Next.js 'next lint' without ESLint config opens an interactive wizard.
            # Skip only that unconfigured command; still enforce typecheck/build.
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint?.trim()==='next lint' ? 0 : 1)" && \
               ! find . -maxdepth 1 \( -name 'eslint.config.*' -o -name '.eslintrc*' \) | grep -q .; then
              echo "::warning::Skipping unconfigured interactive next lint; configure ESLint separately."
            else
              npm run lint --if-present
            fi
            npm run typecheck --if-present
            npm run build --if-present
          fi
          git config --local --unset-all http.https://github.com/.extraheader || true
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth_header" push origin HEAD:main

  verify-pr:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ hashFiles('package.json') != '' }}
        with:
          node-version: '22'
      - name: Validate project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            npm ci
            export CI=true
            # Next.js 'next lint' without ESLint config opens an interactive wizard.
            # Skip only that unconfigured command; still enforce typecheck/build.
            if node -e "const p=require('./package.json'); process.exit(p.scripts?.lint?.trim()==='next lint' ? 0 : 1)" && \
               ! find . -maxdepth 1 \( -name 'eslint.config.*' -o -name '.eslintrc*' \) | grep -q .; then
              echo "::warning::Skipping unconfigured interactive next lint; configure ESLint separately."
            else
              npm run lint --if-present
            fi
            npm run typecheck --if-present
            npm run build --if-present
          else
            echo "No package.json; no generic project checks configured."
          fi
